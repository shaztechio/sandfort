<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #16120d;
    color: #f6eee0;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(760px 520px at 16% 8%, rgba(232,165,74,.20), transparent 62%),
      radial-gradient(680px 480px at 92% 96%, rgba(111,179,212,.14), transparent 60%);
  }
  .rule {
    position: absolute; left: 0; right: 0; top: 0; height: 6px;
    background: linear-gradient(90deg, #e8a54a 0%, #d98b3c 38%, #c8462d 68%, #4a9fc9 100%);
  }
  .wrap {
    position: relative;
    height: 100%;
    padding: 74px 78px 62px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top { display: flex; align-items: center; gap: 42px; }
  .icon {
    width: 172px; height: 172px; flex: none;
    border-radius: 38px;
    box-shadow: 0 24px 60px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(246,238,224,.09);
  }
  h1 {
    font-size: 88px;
    font-weight: 700;
    letter-spacing: -2.5px;
    line-height: 1;
    margin-bottom: 16px;
  }
  .tagline {
    font-size: 35px;
    font-weight: 600;
    letter-spacing: -.6px;
    color: #e8a54a;
    line-height: 1.15;
  }
  .body {
    font-size: 27px;
    line-height: 1.45;
    color: #c3b39c;
    letter-spacing: -.2px;
    max-width: 1000px;
  }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .pills { display: flex; gap: 14px; }
  .pill {
    font-size: 21px;
    font-weight: 500;
    letter-spacing: -.1px;
    color: #f7e7c8;
    background: rgba(232,165,74,.13);
    border: 1px solid rgba(232,165,74,.32);
    border-radius: 999px;
    padding: 11px 22px;
  }
  .domain {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 24px;
    color: #93826c;
    letter-spacing: -.3px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="rule"></div>
  <div class="wrap">
    <div class="top">
      <img class="icon" src="../../docs/assets/Sandfort.png" alt="The Sandfort app icon: a sandcastle with a shield, in a wooden sandbox." />
      <div>
        <h1>Sandfort</h1>
        <div class="tagline">A clean machine for untrusted work</div>
      </div>
    </div>

    <div class="body">
      Disposable Ubuntu, Fedora, Debian, and openSUSE VMs for UTM on Apple&nbsp;silicon &mdash;
      so untrusted code never runs on your real machine.
    </div>

    <div class="bottom">
      <div class="pills">
        <div class="pill">Offline by default</div>
        <div class="pill">Verified images</div>
        <div class="pill">Reset in seconds</div>
      </div>
      <div class="domain">sandfort.app</div>
    </div>
  </div>
</body>
</html>
