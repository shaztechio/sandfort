name: Signed release

# Never on pull_request. This repository is public, and a workflow that runs on
# a fork's pull request would hand the signing certificate to code the author
# does not control. Tags and manual runs only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Cut a release? "none" builds and signs without publishing.'
        type: choice
        default: none
        options: [none, patch, minor, major]
      version:
        description: 'Exact version x.y.z. Overrides the bump choice.'
        type: string
        default: ''

# write is needed to create the Release, and to push the version bump when a
# release is cut from the browser. It is the only elevated permission here, and
# it is why this workflow must never be reachable from a fork's pull request.
permissions:
  contents: write

# One release at a time. Two overlapping runs would race over the version in
# Info.plist and could publish two releases from the same number.
concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  build:
    # Apple silicon runner: Sandfort is an arm64 app and this is an arm64 build.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # The bump step pushes a commit and a tag, which needs the token the
          # checkout leaves behind.
          persist-credentials: true

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      # Cutting a release from the browser. Everything `make release` does on a
      # laptop, before anything is built, so the app that gets signed already
      # carries the new version.
      #
      # Pushing the tag here does not start a second run of this workflow:
      # GitHub does not raise workflow events for pushes made with GITHUB_TOKEN.
      - name: Bump the version and tag
        id: bump
        if: github.event_name == 'workflow_dispatch' && (inputs.bump != 'none' || inputs.version != '')
        run: |
          set -euo pipefail
          plist="tools/packaging/Info.plist"
          current="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")"

          requested="${{ inputs.version }}"
          if [ -n "$requested" ]; then
            version="${requested#v}"
          else
            major="${current%%.*}"; rest="${current#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            case "${{ inputs.bump }}" in
              patch) version="$major.$minor.$((patch + 1))" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              major) version="$((major + 1)).0.0" ;;
              *) echo "unknown bump ${{ inputs.bump }}"; exit 1 ;;
            esac
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "$version is not a valid x.y.z version"; exit 1 ;;
          esac

          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists."
            exit 1
          fi

          # The build number rises across every version: macOS treats a lower
          # one as a downgrade even when the visible version went up.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $((build + 1))" "$plist"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$plist"
          git commit -m "Release $tag"
          git tag -a "$tag" -m "Sandfort $version"
          git push origin HEAD:"${GITHUB_REF_NAME}"
          git push origin "$tag"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Cut $tag from $current ($build)"

      - name: Run tests
        run: make test

      - name: Build the app
        run: make app

      # The certificate lives in a throwaway keychain, not the login keychain,
      # so nothing outlives the job. set-key-partition-list is what stops
      # codesign blocking on a UI prompt that no one can answer on a runner.
      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Random per run: this password protects nothing beyond the job.
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"

          echo "$CERTIFICATE_P12" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          rm -f "$certificate"

          echo "Identities available to this job:"
          security find-identity -v -p codesigning "$keychain" | sed 's/^/  /'

      - name: Sign, notarize, and staple
        env:
          SANDFORT_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          SANDFORT_APPLE_ID: ${{ secrets.APPLE_ID }}
          SANDFORT_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SANDFORT_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: make signed-app

      # Proves what is about to be published, rather than trusting that the
      # previous step's exit code covered everything.
      - name: Verify the notarized app
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 dist/Sandfort.app
          spctl --assess --type execute --verbose=4 dist/Sandfort.app
          xcrun stapler validate dist/Sandfort.app
          codesign -d --entitlements - dist/Sandfort.app 2>/dev/null \
            | grep -q 'com.apple.security.automation.apple-events' \
            || { echo "Apple Events entitlement missing; Sandfort could not start a VM."; exit 1; }

      # A run publishes when it was started by a tag push, or when the bump step
      # just created one. Deciding it once keeps the later steps from drifting
      # apart on separate conditions.
      - name: Decide whether this run publishes
        id: mode
        run: |
          set -euo pipefail
          if [ -n "${{ steps.bump.outputs.tag }}" ]; then
            tag="${{ steps.bump.outputs.tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Publishing $tag"
          else
            echo "Build and sign only; nothing will be published."
          fi

      # The version comes from the app that was just built, not from the tag, so
      # the filename can never disagree with what is inside the bundle.
      - name: Read the built version
        id: version
        run: |
          set -euo pipefail
          plist="dist/Sandfort.app/Contents/Info.plist"
          short="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "name=Sandfort-$short-$build" >> "$GITHUB_OUTPUT"
          printf 'Built Sandfort %s (%s)\n' "$short" "$build"

      # A tag that disagrees with the built version would publish a release whose
      # name does not match its contents. Fail instead, before anything is
      # published; the fix is a version bump, not a re-run.
      - name: Check the tag matches the built version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          built="${{ steps.version.outputs.short }}"
          if [ "$tag" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $built."
            echo "Update tools/packaging/Info.plist, or tag v$built."
            exit 1
          fi
          echo "Tag and built version agree: $built"

      - name: Package for download
        run: |
          set -euo pipefail
          zip="dist/${{ steps.version.outputs.name }}.zip"
          ditto -c -k --keepParent dist/Sandfort.app "$zip"
          shasum -a 256 "$zip" | sed 's|dist/||' | tee "$zip.sha256"

      # Tag builds publish a Release, whose asset is the zip itself: downloading
      # it expands straight to Sandfort.app. Uploading the same zip as an
      # artifact as well would be the redundant copy that arrives double-zipped,
      # because upload-artifact zips whatever it is given.
      #
      # Manual runs have no Release, so the artifact is the only way to get the
      # build out. It stays zipped on purpose: artifacts do not preserve the
      # executable bit, and a raw .app would download as a bundle whose binary
      # cannot run.
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.tag == ''
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            dist/${{ steps.version.outputs.name }}.zip
            dist/${{ steps.version.outputs.name }}.zip.sha256

      # Tags only. A manual run still builds, signs, and uploads an artifact, so
      # the pipeline can be exercised without publishing anything.
      - name: Create the GitHub Release
        if: steps.mode.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="dist/${{ steps.version.outputs.name }}.zip"
          notes="$(mktemp)"
          {
            printf 'Sandfort %s (build %s)\n\n' \
              "${{ steps.version.outputs.short }}" "${{ steps.version.outputs.build }}"
            printf 'Signed with a Developer ID certificate, notarized by Apple, and stapled.\n\n'
            printf 'Requires macOS 13 or later on Apple silicon, and [UTM](https://mac.getutm.app/).\n\n'
            printf 'SHA-256:\n\n```\n'
            cat "$zip.sha256"
            printf '```\n'
          } > "$notes"
          gh release create "${{ steps.mode.outputs.tag }}" "$zip" "$zip.sha256" \
            --title "Sandfort ${{ steps.version.outputs.short }}" \
            --notes-file "$notes" \
            --verify-tag

      # Runs even if a step above failed, so a failure never leaves a signing
      # certificate on the runner.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
