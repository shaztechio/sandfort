name: Tests

# Safe on pull requests, unlike the release workflow: this needs no secrets, so a
# branch from a fork cannot use it to reach the signing certificate. Running here
# is the point — a contributor should not have to be told afterwards that their
# change was never tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run for the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    # The same runner the release build uses, so a green suite here means the
    # toolchain that will actually ship it.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - run: make test
