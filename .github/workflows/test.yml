name: Tests

# Safe on pull requests, unlike the release workflow: this needs no secrets, so a
# branch from a fork cannot use it to reach the signing certificate. Running here
# is the point — a contributor should not have to be told afterwards that their
# change was never tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run for the same branch.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The title becomes the commit subject on squash and then a release note line,
  # so it is the only part of a pull request that outlives it. Cheap and fast, so
  # it runs before the suite rather than after.
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the title, and that a guest change declares its impact
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BASE" "$HEAD"
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          printf 'Changed files:\n%s\n\n' "$changed"
          # shellcheck disable=SC2086
          python3 tools/packaging/check-pull-request.py $changed

  macos-arm64:
    # The same runner the release build uses, so a green suite here means the
    # toolchain that will actually ship it.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - run: make test
