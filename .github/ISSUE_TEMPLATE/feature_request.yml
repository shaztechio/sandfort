name: Feature request
description: Suggest a change to Sandfort
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Sandfort's catalog is deliberately small and its isolation rules are
        deliberately strict. Proposals that relax them are unlikely to be
        accepted — see CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the situation, not only the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Isolation impact
      options:
        - label: This does not require host sharing, clipboard sync, USB sharing, port forwarding, or bridged networking.
        - label: This does not require running shell commands or AppleScript at run time.
        - label: I have read CONTRIBUTING.md.
